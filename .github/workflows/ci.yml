# Bomber Buddies — compile check and builds on GitHub's free runners (GameCI).
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE  = the contents of C:\ProgramData\Unity\Unity_lic.ulf from a PC where Unity Hub
#                    activated a free Personal licence (Hub → Preferences → Licenses → Add)
#   UNITY_EMAIL    = the Unity account e-mail
#   UNITY_PASSWORD = the Unity account password
#
# Every push: "test" compiles the project and runs the edit-mode tests (about 5-10 min).
# Pushes to main (or the "Run workflow" button): a Windows build and an Android APK, downloadable
# from the run's Artifacts section.
name: Build

on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_dispatch:
    inputs:
      android:
        description: Also build the Android APK
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-

      - name: Run edit-mode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Edit-mode tests

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts

  windows:
    name: Windows build
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-win-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-win-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildName: BomberBuddies
          buildMethod: BomberBuddies.Editor.BuildScript.Build
          versioning: Semantic
          allowDirtyBuild: true

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BomberBuddies-Windows
          path: build/StandaloneWindows64

  android:
    name: Android APK
    needs: test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.android)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          buildName: BomberBuddies
          buildMethod: BomberBuddies.Editor.BuildScript.Build
          versioning: Semantic
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}
          allowDirtyBuild: true

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: BomberBuddies-Android
          path: build/Android
